<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Agenda | SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-common.css"><style>body{background:#f5f8f7}.admin-shell{width:min(calc(100% - 32px),1180px);margin:0 auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px;box-shadow:0 14px 40px rgba(7,95,83,.08)}.login{max-width:520px;margin:40px auto;padding:28px}.login label,.admin-form label{display:grid;gap:7px;font-weight:700}.login input,.admin-form input,.admin-form select,.admin-form textarea,.filters input,.filters select{width:100%;padding:12px 14px;border:1px solid #d7e3df;border-radius:12px;font:inherit;background:#fff}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.list-head{padding:18px;border-bottom:1px solid #e2ebe8;display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{padding:14px;border-bottom:1px solid #edf2f0;display:grid;gap:9px}.filter-row,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.item{width:100%;padding:15px 18px;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left;cursor:pointer}.item:hover,.item.active{background:#eef9f6}.item h3{margin:6px 0 4px;font-size:.98rem}.item p{margin:0;color:#687875}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf8f5;color:#087f6e;font-size:.7rem;font-weight:800}.detail{padding:24px}.admin-form{display:grid;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#687875}.error{color:#b42318}.danger{background:#fff;color:#b42318;border:1px solid #efc4c0}.secondary{background:#fff;color:#087f6e;border:1px solid #cfe4df}@media(max-width:850px){.grid,.form-grid,.filter-row{grid-template-columns:1fr}.list{max-height:380px}}</style></head><body class="admin-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span>SDN KALIBARU 3</span></a></div></header><main class="admin-shell"><section id="login" class="panel login module-login"><form id="login-form"><input id="token" type="password"><p id="login-error" class="error"></p></form></section><section id="app" hidden><div class="admin-topbar"><div class="admin-topbar-copy"><div class="section-label">Panel Admin</div><h1>Agenda & Kegiatan</h1><p>Kelola agenda dan kegiatan sekolah.</p></div><div class="admin-topbar-actions"><a class="button admin-action" href="admin.html">Dashboard</a><a class="button admin-action admin-action-public" href="informasi.html#agenda" target="_blank" rel="noopener noreferrer">Halaman Publik ↗</a><button id="logout" data-admin-logout class="button admin-action admin-action-logout" type="button">Keluar</button></div></div><div class="grid"><aside class="panel"><div class="list-head"><strong id="count">0 agenda</strong><button id="new-item" class="button">+ Tambah</button></div><div class="filters"><input id="search" type="search" placeholder="Cari agenda..."><div class="filter-row"><select id="filter-status"><option value="">Semua status</option><option value="publish">Publish</option><option value="draft">Draft</option></select><button id="reset-filter" class="button secondary">Reset filter</button></div></div><div id="list" class="list"></div></aside><section class="panel"><div id="detail" class="detail"></div></section></div></section></main><script src="../assets/js/main.js"></script><script src="../assets/js/admin-session.js"></script><script src="../assets/js/admin-agenda.js"></script></body></html>
