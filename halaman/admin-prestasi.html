<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Prestasi | SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8f7}.shell{width:min(calc(100% - 32px),1180px);margin:auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px}.login{max-width:520px;margin:40px auto;padding:28px}.login label,.form label{display:grid;gap:7px;font-weight:700}.login input,.form input,.form select,.form textarea,.filters input,.filters select{width:100%;padding:12px 14px;border:1px solid #d7e3df;border-radius:12px;font:inherit}.login .button{width:100%;margin-top:16px}.toolbar,.actions,.list-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.list-head,.filters,.detail{padding:18px}.filters{border-top:1px solid #edf2f0;border-bottom:1px solid #edf2f0;display:grid;gap:9px}.filter-row,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.item{width:100%;padding:15px 18px;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left}.item:hover,.item.active{background:#eef9f6}.item h3{margin:6px 0 4px;font-size:.98rem}.item p{margin:0;color:#687875}.badge{padding:4px 8px;border-radius:999px;background:#eaf8f5;color:#087f6e;font-size:.7rem;font-weight:800}.form{display:grid;gap:14px}.muted{color:#687875}.error,.danger{color:#b42318}.secondary,.danger{background:#fff;border:1px solid #cfe4df}.danger{border-color:#efc4c0}@media(max-width:850px){.grid,.form-grid,.filter-row{grid-template-columns:1fr}.list{max-height:380px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html">SDN KALIBARU 3</a></div></header><main class="shell"><section id="login" class="panel login"><div class="section-label">Panel Admin</div><h1>Kelola Prestasi</h1><form id="login-form"><label>Token admin<input id="token" type="password" required></label><button class="button">Masuk →</button><p id="login-error" class="error"></p></form></section><section id="app" hidden><div class="toolbar"><div><div class="section-label">Panel Admin</div><h1>Prestasi</h1><p class="muted">Kelola prestasi peserta didik dan sekolah.</p></div><div class="actions"><a class="button secondary" href="admin.html">Dashboard</a><a class="button secondary" href="prestasi.html" target="_blank">Halaman Publik ↗</a><button id="logout" class="button secondary">Keluar</button></div></div><div class="grid"><aside class="panel"><div class="list-head"><strong id="count"></strong><button id="new" class="button">+ Tambah</button></div><div class="filters"><input id="search" placeholder="Cari prestasi..."><div class="filter-row"><select id="filter"><option value="">Semua status</option><option value="publish">Publish</option><option value="draft">Draft</option></select><button id="reset" class="button secondary">Reset</button></div></div><div id="list" class="list"></div></aside><section class="panel"><div id="detail" class="detail"></div></section></div></section></main><script src="../assets/js/admin-prestasi.js"></script></body></html>
