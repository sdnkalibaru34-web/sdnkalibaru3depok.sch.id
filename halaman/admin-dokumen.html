<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Dokumen | SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-common.css"><style>body{background:#f5f8f7}.shell{width:min(calc(100% - 32px),1180px);margin:auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px}.login{max-width:520px;margin:40px auto;padding:28px}.login label,.form label{display:grid;gap:7px;font-weight:700}.login input,.form input,.form select,.form textarea,.filters input,.filters select{width:100%;padding:12px 14px;border:1px solid #d7e3df;border-radius:12px;font:inherit}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.head,.filters,.detail{padding:18px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{border-top:1px solid #edf2f0;border-bottom:1px solid #edf2f0;display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.item{width:100%;padding:15px 18px;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left}.item:hover,.item.active{background:#eef9f6}.item h3{margin:6px 0 4px}.item p{margin:0;color:#687875}.badge{padding:4px 8px;border-radius:999px;background:#eaf8f5;color:#087f6e;font-size:.7rem;font-weight:800}.form{display:grid;gap:14px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#687875}.error,.danger{color:#b42318}.secondary,.danger{background:#fff;border:1px solid #cfe4df}.danger{border-color:#efc4c0}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}</style></head><body class="admin-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html">SDN KALIBARU 3</a></div></header><main class="shell"><section id="login" class="panel login module-login"><form id="login-form"><input id="token" type="password"><p id="login-error" class="error"></p></form></section><section id="app" hidden><div class="admin-topbar"><div class="admin-topbar-copy"><div class="section-label">Panel Admin</div><h1>Dokumen Sekolah</h1><p>Kelola dokumen dan file unduhan publik.</p></div><div class="admin-topbar-actions"><a class="button admin-action" href="admin.html">Dashboard</a><a class="button admin-action admin-action-public" href="informasi.html#dokumen" target="_blank" rel="noopener noreferrer">Halaman Publik ↗</a><button id="logout" data-admin-logout class="button admin-action admin-action-logout" type="button">Keluar</button></div></div><div class="grid"><aside class="panel"><div class="head"><strong id="count"></strong><button id="new" class="button">+ Tambah</button></div><div class="filters"><input id="search" placeholder="Cari dokumen..."><div class="row"><select id="filter"><option value="">Semua status</option><option value="publish">Publish</option><option value="draft">Draft</option></select><button id="reset" class="button secondary">Reset</button></div></div><div id="list" class="list"></div></aside><section class="panel"><div id="detail" class="detail"></div></section></div></section></main><script src="../assets/js/admin-session.js"></script><script src="../assets/js/admin-dokumen.js"></script></body></html>
