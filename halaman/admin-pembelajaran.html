<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Pembelajaran | SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8f7}.admin-shell{width:min(calc(100% - 32px),1180px);margin:0 auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px;box-shadow:0 14px 40px rgba(7,95,83,.08)}.login{max-width:520px;margin:40px auto;padding:28px}.login label,.learning-form label{display:grid;gap:7px;font-weight:700}.login input,.learning-form input,.learning-form select,.learning-form textarea{width:100%;padding:12px 14px;border:1px solid #d7e3df;border-radius:12px;font:inherit}.login .button{width:100%;margin-top:16px}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.list-head{padding:18px;border-bottom:1px solid #e2ebe8;display:flex;justify-content:space-between;gap:10px;align-items:center}.list{max-height:70vh;overflow:auto}.item{width:100%;padding:15px 18px;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left;cursor:pointer}.item:hover,.item.active{background:#eef9f6}.item h3{margin:6px 0 4px;font-size:.98rem}.item p,.item small{margin:0;color:#687875}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf8f5;color:#087f6e;font-size:.7rem;font-weight:800}.detail{padding:24px}.learning-form{display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#687875}.error{color:#b42318}.danger{background:#fff;color:#b42318;border:1px solid #efc4c0}.secondary{background:#fff;color:#087f6e;border:1px solid #cfe4df}@media(max-width:850px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.list{max-height:380px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span>SDN KALIBARU 3</span></a></div></header><main class="admin-shell"><section id="login" class="panel login"><div class="section-label">Panel Admin</div><h1>Kelola Pembelajaran</h1><p class="muted">Gunakan token admin yang sama dengan Panel Admin Pesan.</p><form id="login-form"><label>Token admin<input id="token" type="password" required></label><button class="button" type="submit">Masuk →</button><p id="login-error" class="error"></p></form></section><section id="app" hidden><div class="toolbar"><div><div class="section-label">Panel Admin</div><h1 style="margin:0">Pembelajaran</h1><p class="muted" style="margin:4px 0 0">Tambah, edit, publish, atau nonaktifkan materi pembelajaran.</p></div><div class="toolbar-actions"><a class="button secondary" href="admin-pesan.html">Pesan & FAQ</a><a class="button secondary" href="pembelajaran.html" target="_blank">Halaman Publik ↗</a><button id="logout" class="button secondary" type="button">Keluar</button></div></div><div class="grid"><aside class="panel"><div class="list-head"><strong id="count">0 materi</strong><button id="new-item" class="button" type="button">+ Tambah</button></div><div id="list" class="list"></div></aside><section class="panel"><div id="detail" class="detail"></div></section></div></section></main><script src="../assets/js/main.js"></script><script src="../assets/js/admin-learning.js"></script></body></html>
