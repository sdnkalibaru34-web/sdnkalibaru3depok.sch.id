<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Pembelajaran | SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-common.css"><style>body{background:#f5f8f7}.admin-shell{width:min(calc(100% - 32px),1180px);margin:0 auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px;box-shadow:0 14px 40px rgba(7,95,83,.08)}.login{max-width:520px;margin:40px auto;padding:28px}.login label,.learning-form label{display:grid;gap:7px;font-weight:700}.login input,.learning-form input,.learning-form select,.learning-form textarea,.admin-filter-input,.admin-filter-select{width:100%;padding:12px 14px;border:1px solid #d7e3df;border-radius:12px;font:inherit;background:#fff}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.list-head{padding:18px;border-bottom:1px solid #e2ebe8;display:flex;justify-content:space-between;gap:10px;align-items:center}.filter-box{padding:14px 16px;border-bottom:1px solid #e2ebe8;background:#fbfdfc}.filter-box label{display:grid;gap:6px;margin-bottom:10px;font-size:.76rem;font-weight:800;color:#51625f;text-transform:uppercase;letter-spacing:.04em}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filter-actions{display:flex;justify-content:flex-end;margin-top:10px}.filter-reset{border:0;background:transparent;color:#087f6e;font:inherit;font-weight:700;cursor:pointer;padding:4px}.list{max-height:62vh;overflow:auto}.item{width:100%;padding:15px 18px;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left;cursor:pointer}.item:hover,.item.active{background:#eef9f6}.item h3{margin:6px 0 4px;font-size:.98rem}.item p,.item small{margin:0;color:#687875}.item-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:3px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf8f5;color:#087f6e;font-size:.7rem;font-weight:800}.badge.draft{background:#f3f4f4;color:#687875}.detail{padding:24px}.learning-form{display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#687875}.error{color:#b42318}.danger{background:#fff;color:#b42318;border:1px solid #efc4c0}.secondary{background:#fff;color:#087f6e;border:1px solid #cfe4df}.empty-filter{padding:26px 18px;text-align:center;color:#687875}.search-wrap{position:relative}.search-wrap input{padding-right:38px}.search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#879793;pointer-events:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.list{max-height:420px}}@media(max-width:520px){.filter-row{grid-template-columns:1fr}}</style></head><body class="admin-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span>SDN KALIBARU 3</span></a></div></header><main class="admin-shell"><section id="login" class="panel login module-login"><form id="login-form"><input id="token" type="password"><p id="login-error" class="error"></p></form></section><section id="app" hidden><div class="admin-topbar"><div class="admin-topbar-copy"><div class="section-label">Panel Admin</div><h1>Pembelajaran</h1><p>Tambah, edit, publish, atau nonaktifkan materi pembelajaran.</p></div><div class="admin-topbar-actions"><a class="button admin-action" href="admin.html">Dashboard</a><a class="button admin-action admin-action-public" href="pembelajaran.html" target="_blank" rel="noopener noreferrer">Halaman Publik ↗</a><button id="logout" data-admin-logout class="button admin-action admin-action-logout" type="button">Keluar</button></div></div><div class="grid"><aside class="panel"><div class="list-head"><strong id="count">0 materi</strong><button id="new-item" class="button" type="button">+ Tambah</button></div><div class="filter-box"><label>Pencarian<div class="search-wrap"><input id="search-material" class="admin-filter-input" type="search" placeholder="Cari judul, mapel, atau deskripsi..."><span class="search-icon">⌕</span></div></label><div class="filter-row"><label>Kelas<select id="filter-class" class="admin-filter-select"><option value="">Semua kelas</option><option value="1">Kelas 1</option><option value="2">Kelas 2</option><option value="3">Kelas 3</option><option value="4">Kelas 4</option><option value="5">Kelas 5</option><option value="6">Kelas 6</option></select></label><label>Status<select id="filter-status" class="admin-filter-select"><option value="">Semua status</option><option value="publish">Publish</option><option value="draft">Draft</option></select></label></div><div class="filter-row"><label>Mata Pelajaran<select id="filter-subject" class="admin-filter-select"><option value="">Semua mapel</option></select></label><label>Jenis Konten<select id="filter-type" class="admin-filter-select"><option value="">Semua jenis</option><option>Materi Pembelajaran</option><option>Video Pembelajaran</option><option>Latihan</option><option>LKPD</option><option>Sumber Belajar</option></select></label></div><div class="filter-actions"><button id="reset-filter" class="filter-reset" type="button">Reset filter</button></div></div><div id="list" class="list"></div></aside><section class="panel"><div id="detail" class="detail"></div></section></div></section></main><script src="../assets/js/main.js"></script><script src="../assets/js/admin-session.js"></script><script src="../assets/js/admin-learning.js"></script></body></html>
